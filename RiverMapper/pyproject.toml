[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RiverMapper"
version = "1.0.4"
description = "Python tools for generating watershed river arcs for meshing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Fei Ye", email = "feiye@vims.edu"},
]
dependencies = [
  "GDAL>=3.6.0",
  "rasterio>=1.3",
  "shapely>=2.0.0",
  "geopandas>=0.12.0",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "mpi4py",
  "tqdm",
  "rtree",
]

[project.optional-dependencies]
marsh = [
  "scikit-image>=0.24",
]
full = [
  "scikit-image>=0.24",
]

[project.scripts]
marsh-decomposition = "RiverMapper.marsh.workflow:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["RiverMapper", "RiverMapper.*"]
exclude = ["RiverMapper.Data*", "RiverMapper.Tests*"]
namespaces = true
